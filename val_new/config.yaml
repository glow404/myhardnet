# val_new 默认配置。
#
# 设计目标：
# 1. 先用 RootSIFT 找出 SIFT 表现差的图像对。
# 2. 只在这些困难图像对上做 RootSIFT vs HardNet 公平对比。
# 3. 公平对比时，两种描述子使用完全相同的匹配策略和参数。

seed: 42

data:
  pairs_csv: ../outputs/hardnet_dataset/test_pairs.csv

model:
  checkpoint: ../outputs/hardnet_train_post_nips_cosine5.26/best.pt
  dropout: 0.3
  final_bn_affine: false
  device: auto
  batch_size: 512

sift:
  nfeatures: 300
  nOctaveLayers: 4
  contrastThreshold: 0.03
  edgeThreshold: 17.5
  sigma: 1.70
  enable_rootsift: true
  enable_clahe: true
  clahe_clip: 4.0
  clahe_tile: [8, 8]
  enable_blur: true
  blur_sigma: 0.8

patch:
  # 与 pair_build 和 match_new 一致：局部仿射一次采样，直接生成 32x32 patch。
  crop_size: 32
  out_size: 32
  normalize: true
  min_overlap_ratio: 0.55

ransac:
  reproj_thresh: 1.0
  min_matches: 3

hard_case:
  # 按 RootSIFT 内点数从少到多选择 bottom_k 对图像。
  bottom_k: 50
  # 空值表示扫描 CSV 中全部唯一 image_pair；调试时可用命令行 --max-image-pairs 覆盖。
  max_image_pairs:
  # 用这个策略来定义“SIFT 表现差”。
  selection_strategy: sift_ratio_0.85_two_way
  # 每个困难图像对预览图最多画多少条 RANSAC 内点连线。
  preview_max_inliers: 80

strategies:
  # 这些策略会同时用于 RootSIFT 和 HardNet，保证公平。
  - name: ratio_0.85_two_way
    matcher: ratio
    ratio_thresh: 0.85
    mutual: true
  - name: ratio_0.95_no_two_way
    matcher: ratio
    ratio_thresh: 0.95
    mutual: false
  - name: top2_mutual
    matcher: topk
    top_k: 2
    mutual: true
  - name: top5_mutual
    matcher: topk
    top_k: 5
    mutual: true

output:
  output_dir: ../outputs/val_new_eval

